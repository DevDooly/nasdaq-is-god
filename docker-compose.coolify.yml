version: '3.8'

services:
  # 1. PostgreSQL DB
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-nasdaq_god}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. 백엔드 API (FastAPI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-nasdaq_god}
      - RESET_DB=${RESET_DB:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "9000:9000"
    depends_on:
      - db

  # 3. 프론트엔드 Web (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - backend

  # 4. 텔레그램 트레이딩/알림 봇 (Optional)
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-nasdaq_god}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - backend

volumes:
  postgres_data:
